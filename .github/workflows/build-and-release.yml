name: Build, Test & Package

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub release for current commit'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng

      - name: Verify Python compilation
        run: |
          python3 -m py_compile app.py gui_desktop.py build_bundle.py build_dmg.py server/*.py tv_matcher/*.py tests/*.py

      - name: Verify JavaScript syntax
        run: |
          node --check web/app.js

      - name: Run test suite
        run: |
          python3 -m unittest discover -s tests -t . -v

  build-executables:
    name: Build Standalone Binary (${{ matrix.os }} - ${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            artifact_name: tvbackupmatcher-macos-arm64
          - os: macos-15-intel
            arch: x86_64
            artifact_name: tvbackupmatcher-macos-x86_64
          - os: ubuntu-22.04
            arch: x86_64
            artifact_name: tvbackupmatcher-linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller

      - name: Build standalone executable
        run: |
          python3 build_bundle.py

      - name: Prepare binary artifact
        run: |
          chmod +x dist/tvbackupmatcher
          cp dist/tvbackupmatcher ${{ matrix.artifact_name }}

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  build-macos-dmg:
    name: Build Self-Contained macOS DMG & App
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies via Homebrew
        run: |
          brew install ffmpeg tesseract mediainfo mkvtoolnix dovi_tool
          # Download dovi_convert so it is bundled directly into the macOS app
          curl -sSL https://raw.githubusercontent.com/cryptochrome/dovi_convert/master/dovi_convert.py -o "$(brew --prefix)/bin/dovi_convert"
          chmod +x "$(brew --prefix)/bin/dovi_convert"

      - name: Install PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller

      - name: Build self-contained DMG with bundled dependencies
        run: |
          python3 build_dmg.py
          # Package the .app bundle as a zip archive preserving symlinks and signatures
          ditto -c -k --sequesterRsrc --keepParent dist/TVBackupMatcher.app dist/TVBackupMatcher-macOS-app.zip

      - name: Upload macOS DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: TVBackupMatcher-macOS.dmg
          path: dist/TVBackupMatcher-macOS.dmg
          if-no-files-found: error

      - name: Upload macOS App Zip
        uses: actions/upload-artifact@v4
        with:
          name: TVBackupMatcher-macOS-app.zip
          path: dist/TVBackupMatcher-macOS-app.zip
          if-no-files-found: error

  build-docker:
    name: Build Docker Container (Multi-Arch)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: tvbackupmatcher:latest

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    needs: [build-executables, build-macos-dmg, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum TVBackupMatcher* tvbackupmatcher* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
